<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow-x: hidden;
}

.container {
    padding: 40px;
}

button {
    padding: 12px 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-size: 18px;
    border-radius: 25px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #ff1e4d;
}

.hidden {
    display: none;
}

h1 {
    font-size: 2.5rem;
}

#final {
    font-size: 3rem;
    color: #fff;
    text-shadow: 0 0 10px #ff4d6d;
}

.heart {
    position: fixed;
    color: red;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

#noBtn {
    position: relative;
}
</style>
</head>

<body>

<div class="container" id="start">
    <h1>Someone has a surprise for you 💌</h1>
    <button onclick="showPassword()">Click to Continue</button>
</div>

<div class="container hidden" id="passwordBox">
    <h2>Enter Password 🔐</h2>
    <p>Hint: Your special date 💕</p>
    <input type="password" id="pass">
    <br>
    <button onclick="checkPass()">Submit</button>
</div>

<div class="container hidden" id="messageBox">
    <h2 id="typing"></h2>
</div>

<div class="container hidden" id="finalBox">
    <h1 id="final">Happy Birthday My Love ❤️</h1>
    <p>You are the most special person in my life 💖</p>

    <button onclick="loveYes()">Do you love me? 😏</button>
    <button id="noBtn" onmouseover="moveNo()">No 😅</button>
</div>

<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>
function showPassword() {
    document.getElementById("start").classList.add("hidden");
    document.getElementById("passwordBox").classList.remove("hidden");
}

function checkPass() {
    let pass = document.getElementById("pass").value;
    if(pass === "harshit") { // CHANGE PASSWORD HERE
        document.getElementById("passwordBox").classList.add("hidden");
        document.getElementById("messageBox").classList.remove("hidden");
        typeText();
    } else {
        alert("Wrong Password 😢");
    }
}

let text = "Happy Birthday to the most beautiful girl 💖 You mean everything to me...";
let i = 0;

function typeText() {
    if(i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeText, 50);
    } else {
        setTimeout(showFinal, 2000);
    }
}

function showFinal() {
    document.getElementById("messageBox").classList.add("hidden");
    document.getElementById("finalBox").classList.remove("hidden");
    createHearts();
}

function loveYes() {
    alert("I love you too ❤️🥰");
}

function moveNo() {
    let btn = document.getElementById("noBtn");
    btn.style.left = Math.random()*200 + "px";
    btn.style.top = Math.random()*200 + "px";
}

function createHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random()*100 + "vw";
        heart.style.fontSize = Math.random()*20 + 20 + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }, 300);
}
</script>

</body>
</html>
